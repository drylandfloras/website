<!-- Tsiino Hiiwiida language runtime loader.
     Mantém caminhos funcionando em páginas na raiz e em subpastas do Quarto. -->
<script>
(function () {
  "use strict";

  function getSitePrefix() {
    var bootstrap = document.getElementById("quarto-bootstrap");
    if (bootstrap) {
      var href = bootstrap.getAttribute("href") || "";
      var marker = "site_libs/bootstrap/";
      var idx = href.indexOf(marker);
      if (idx >= 0) return href.slice(0, idx);
    }
    return "";
  }

  function loadScript(src, callback) {
    var script = document.createElement("script");
    script.src = src;
    script.defer = false;
    if (callback) script.onload = callback;
    document.head.appendChild(script);
  }

  var prefix = getSitePrefix();
  loadScript(prefix + "js/translate.js", function () {
    loadScript(prefix + "js/language.js");
  });
})();
</script>
