project:
  output-dir: docs
  type: website
  render:
    - index.qmd
    - acesso/index.qmd
    - expedicoes/index.qmd
    - ferramentas/validador-herbario/index.qmd
    - team/index.qmd
  resources:
    - figures/**
    - js/**
    - css/**
    - assets/**
    - test_data/**

website:
  title: "Dryland Floras Network"
  site-url: "https://deborazuanny.github.io/drylandfloras/"
  page-navigation: true
  reader-mode: false
  search: false
  favicon: "figures/DFN_logo.png"
  navbar:
    search: false
    background: light
    collapse-below: lg
    type: light
    logo: "figures/DFN_logo.png"
    href: index.qmd
    left:
      - text: "About"
        href: index.qmd
      - text: "Expeditions"
        href: expedicoes/index.qmd
      - text: "Data access"
        href: acesso/index.qmd
      - text: "Tools"
        menu:
          - text: "Herbarium spreadsheet validator"
            href: ferramentas/validador-herbario/index.qmd
      - text: "Team"
        href: team/index.qmd

format:
  html:
    toc: true
    embed-resources: false
    self-contained: false
    code-copy: true
    code-overflow: wrap
    code-tools: false
    css:
      - styles.css
    eval: true
    theme: [spacelab, theme.scss]
    include-in-header: gtm-head.html
    include-before-body: gtm-body.html
    include-after-body:
      - tsiino-footer.html
      - _includes/language-router.html
