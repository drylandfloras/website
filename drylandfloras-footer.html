<script>
(function () {
  function getRelativePrefix() {
    const bootstrap = document.getElementById("quarto-bootstrap");
    if (bootstrap) {
      const href = bootstrap.getAttribute("href") || "";
      const marker = "site_libs/bootstrap/";
      const idx = href.indexOf(marker);
      if (idx >= 0) {
        return href.slice(0, idx);
      }
    }

    const pathname = window.location.pathname || "/";
    if (!pathname || pathname === "/") return "";
    const parts = pathname.replace(/^\/+|\/+$/g, "").split("/");
    return parts.length > 1 ? "../".repeat(parts.length - 1) : "";
  }

  function fixFooterPaths() {
    const footer = document.querySelector(".drylandfloras-site-footer");

    if (footer && footer.parentElement !== document.body) {
      document.body.appendChild(footer);
    }

    const prefix = getRelativePrefix();

    document.querySelectorAll(".drylandfloras-site-footer img[data-src]").forEach(function (img) {
      const src = img.getAttribute("data-src");

      if (!src) {
        return;
      }

      img.src = prefix + src.replace(/^\/+/, "");

      img.addEventListener("error", function () {
        img.classList.add("drylandfloras-footer-logo-missing");
      });
    });

    document.querySelectorAll(".drylandfloras-footer-home").forEach(function (link) {
      link.href = prefix + "index.html";
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", fixFooterPaths);
  } else {
    fixFooterPaths();
  }

  window.addEventListener("load", fixFooterPaths);
})();
</script>
